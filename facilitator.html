<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>(F) Data-Driven Cyber Defence | Simulation | Anand Jagadeesh (AJ)</title>
<link rel="icon" href="favicons/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&amp;family=Open+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/color-theme.css">
<link rel="stylesheet" href="css/simulation.css">
<link rel="stylesheet" href="css/toggle_status.css">
<link rel="stylesheet" href="css/defendasaurus.css">
</head>
<body data-mode="fac">
<header class="top">
  <div class="brand"><img class="brand-icon" src="favicons/favicon.png" alt="" aria-hidden="true"><span><a class="brand-home" href="index.html">Data-Driven Cyber Defence</a><small><a href="https://anandj.xyz" target="_blank">Anand Jagadeesh (AJ)</a></small></span></div>
  <a class="btn restart-btn" href="index.html" data-shortcut="r" aria-label="Restart simulation" aria-keyshortcuts="r" title="Restart simulation (r)">↻</a>
  <select class="picker" id="scenarioPicker" aria-label="Choose a scenario" hidden><option value="">Overview</option></select>
  <div class="tools">
    <button class="btn toggle-status" id="timerToggle" data-shortcut="v" aria-keyshortcuts="v" aria-label="Show timer" aria-expanded="false" aria-controls="timerPanel" title="Show timer (v)">◷</button>
    <span class="timer-panel" id="timerPanel" hidden>
      <span class="pace" id="sessPace" title="Session time"><b id="sess">50:00</b>/<span>50:00</span></span>
      <button class="btn toggle-status" id="sessToggle" data-shortcut="p" title="Start timer (p)" aria-label="Start timer" aria-keyshortcuts="p" aria-pressed="false">▷</button>
    </span>
    <button class="btn theme-btn" id="themeSwitch" data-shortcut="t" aria-keyshortcuts="t" aria-pressed="false" aria-label="Switch to dark theme" title="Switch theme (t)">☾</button>
  </div>
</header>
<main class="wrap simulation-wrap" id="app"></main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="js/simulation.js"></script>
<script src="js/defendasaurus.js"></script>
</body>
</html>
